[supervisord]
pidfile=%(here)s/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
nodaemon=true
minfds=1024
minprocs=200
user=nginx

# App workers log to rotating files under /var/log/smaht. That directory is a
# SHARED VOLUME mounted into the Splunk sidecar (deploy/docker/splunk/), which
# tails these files - the forwarder no longer runs in this container. The
# log-shipper program below re-emits the files to stdout so container stdout ->
# CloudWatch is preserved regardless of the sidecar.
[program:smaht1]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6543
stdout_logfile=/var/log/smaht/smaht1.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:smaht2]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6544
stdout_logfile=/var/log/smaht/smaht2.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:smaht3]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6545
stdout_logfile=/var/log/smaht/smaht3.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:smaht4]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6546
stdout_logfile=/var/log/smaht/smaht4.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:smaht5]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6547
stdout_logfile=/var/log/smaht/smaht5.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
autorestart=true
startsecs=5
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true

# Re-emit the app worker log files to container stdout so they still reach
# CloudWatch (the app workers now write to disk for the forwarder). tail -F
# follows across supervisord's log rotation.
[program:log-shipper]
autorestart=true
startsecs=5
command=tail -q -n0 -F /var/log/smaht/smaht1.log /var/log/smaht/smaht2.log /var/log/smaht/smaht3.log /var/log/smaht/smaht4.log /var/log/smaht/smaht5.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true

# NOTE: the Splunk Universal Forwarder is intentionally NOT a program here. It
# runs as its own ECS sidecar (deploy/docker/splunk/) and tails /var/log/smaht
# over a shared volume. Do not re-add a [program:splunkforwarder] block - that was
# the in-app-container design that this branch rolled back.
