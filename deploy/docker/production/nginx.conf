# Production nginx setup
# Adapted from ENCODE, https://gist.github.com/denji/8359866 and https://www.digitalocean.com/community/tools/nginx
# Note that this config assumes 4 vCPU configuration

error_log  /var/log/nginx/error.log warn;
worker_processes 8;
worker_rlimit_nofile 100000;
worker_priority -10;
timer_resolution 100ms;

events {
    worker_connections  1024;
    use epoll;
}
http {
    resolver 8.8.8.8;
    include mime.types;

    # cache information about FDs, might need tuning
    open_file_cache max=200000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Access logs also go to the LB, but we write them to disk here so the Splunk
    # forwarder can ship web-tier access events (see splunk/inputs.conf).
    access_log /var/log/nginx/access.log;

    # Some additional optimizations
    charset utf-8;
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nodelay on;
    tcp_nopush on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;

    # If 502 is encountered, we may have been killed for memory
    # fall back to the next server, until one is back
    proxy_next_upstream error timeout http_502;

    # Allow large POST requests
    client_body_buffer_size 128K;
    client_header_buffer_size 1k;
    client_max_body_size 16M;
    large_client_header_buffers 4 32k;
    request_pool_size 32k;
    output_buffers 16 64k;
    subrequest_output_buffer_size 16m;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 120;
    send_timeout 10s;

    # enable gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 10240;
    gzip_comp_level 2;
    gzip_buffers  32 8M;
    gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream app {
        zone app 32k;
        server 0.0.0.0:6543 fail_timeout=45;
        server 0.0.0.0:6544 fail_timeout=45;
        server 0.0.0.0:6545 fail_timeout=45;
        server 0.0.0.0:6546 fail_timeout=45;
        server 0.0.0.0:6547 fail_timeout=45 backup;
        keepalive 64;
    }

    # Pass basic auth
    proxy_set_header HTTP_AUTHORIZATION $http_authorization;

    # Up proxy buffers considerably, so nginx does not need to call malloc repeatedly for large responses
    proxy_buffer_size 1m;
    proxy_buffers 8 4m;
    proxy_busy_buffers_size 16m;
    proxy_max_temp_file_size 0;

    # Plain HTTP server. Used when the LB->ECS hop is plaintext (TLS disabled).
    # The server body (routing, security headers, static handling) lives in the
    # shared snippet so the TLS server below cannot drift from it.
    server {
        listen 8000;
        include /etc/nginx/conf.d/smaht_server_common.conf;
    }

    # LB->ECS TLS server. Ships EMPTY; when NGINX_TLS_ENABLED=true,
    # setup_nginx_tls.sh (run by entrypoint_portal.sh) materializes the cert/key
    # from the ECS-injected secret and writes a `server { listen 8443 ssl; ...
    # include smaht_server_common.conf; }` block here. With TLS disabled this
    # include is a no-op, so the plain server above keeps working unchanged.
    include /etc/nginx/conf.d/smaht_tls.conf;
}
