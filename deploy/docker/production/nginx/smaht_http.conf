# Plain HTTP (:8000) server for the SMaHT-Portal app container -- the IMAGE DEFAULT.
#
# nginx.conf `include`s this file. The image ships it with the plain :8000 server so
# nginx works out of the box with TLS disabled, and so LOCAL runs (which never invoke
# setup_nginx_tls.sh) get a working server.
#
# At runtime in the portal role, setup_nginx_tls.sh REGENERATES this file:
#   - TLS disabled -> this same plain :8000 server.
#   - TLS enabled  -> emptied, so there is NO plaintext :8000 listener at all (fail
#                     closed); only the generated `listen 8443 ssl` server remains.
#
# The server body (routing, security headers, static handling) lives in the shared
# smaht_server_common.conf so the plain and TLS servers cannot drift.
server {
    listen 8000;
    include /etc/nginx/conf.d/smaht_server_common.conf;
}
