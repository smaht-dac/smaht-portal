# Shared nginx server body for the SMaHT-Portal app container.
#
# Included at `server {}` context by BOTH the plain HTTP server (listen 8000) in
# nginx.conf AND the generated TLS server (listen 8443 ssl) that
# setup_nginx_tls.sh writes into conf.d/smaht_tls.conf for the LB->ECS TLS path.
# Keeping the body here means the two servers can never drift (same routing,
# same security headers, same static handling).
#
# NOTE: this file is included by explicit path, not by a conf.d/*.conf glob, so
# co-locating it under conf.d does not cause a double-include.

port_in_redirect off;

# security headers
add_header X-XSS-Protection        "1; mode=block" always;
add_header X-Content-Type-Options  "nosniff" always;
add_header Referrer-Policy         "no-referrer-when-downgrade" always;
add_header Permissions-Policy      "interest-cohort=()" always;

location /static/ {
    root /home/nginx/smaht-portal/src/encoded;
}

location / {
    # Normalize duplicate slashes
    if ($request ~ ^(GET|HEAD)\s([^?]*)//(.*)\sHTTP/[0-9.]+$) {
        rewrite "^" https://$host$uri permanent;
    }
    proxy_set_header  Host  $http_host;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  Connection  "";

    proxy_pass http://app;
}
location ~ ^/_proxy/(.*)$ {
    internal;
    proxy_set_header Authorization "";
    proxy_set_header Content-Type "";
    proxy_buffering off;
    proxy_pass $1$is_args$args;
}
