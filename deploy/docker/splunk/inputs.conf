# Local file inputs for the SMaHT-Portal Splunk sidecar.
#
# The sidecar does not run inside the application container; it reads the app +
# web logs off a SHARED VOLUME that the app container writes and the sidecar
# mounts (read-only). The ECS task definition owns the volume + mountPoints
# wiring (see README.md, "ECS task-definition handoff"). The paths below are the
# mount targets INSIDE the sidecar container.
#
# In a container the OS security logs the HMS doc targets (/var/log/secure,
# /var/log/audit) do not meaningfully exist, so we monitor the app + web logs
# the application container writes to the shared volume instead.
#
# `index` is intentionally left unset: index routing is governed by the config
# the HMS deployment server pushes (deploymentclient.conf) and the indexer-side
# defaults. Set an explicit `index =` here if these logs must land in a
# specific index.

# App worker logs. The app container writes /var/log/smaht/smahtN.log(.1..5);
# mount that volume into the sidecar at the SAME path. Match the active file and
# the rotated backups so no tail is lost across rotation; Splunk's fishbucket
# dedupes already-read content.
[monitor:///var/log/smaht/smaht*.log*]
disabled = false
sourcetype = smaht:app
# Distinguish rotated files that share a header so they aren't skipped as dupes.
crcSalt = <SOURCE>

# nginx web-tier logs. The app container writes these into the SAME shared
# /var/log/smaht volume (subdir nginx/), so they ship over the single mount the
# sidecar already has -- no separate/optional nginx volume needed (B6). This
# preserves the access/error stream the previous in-app forwarder collected.
[monitor:///var/log/smaht/nginx/access.log*]
disabled = false
sourcetype = nginx:access

[monitor:///var/log/smaht/nginx/error.log*]
disabled = false
sourcetype = nginx:error
